workflows:
  ondevice-las-unsigned-ipa:
    name: OnDevice LAS (unsigned IPA, no Apple account)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build via CODEMAGIC_BUILD_SCRIPT.sh
        script: |
          set -euo pipefail
          chmod +x CODEMAGIC_BUILD_SCRIPT.sh
          ./CODEMAGIC_BUILD_SCRIPT.sh
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData
        - $CM_BUILD_DIR/ThirdParty/llama.cpp/build-apple
        - $CM_BUILD_DIR/ThirdParty/whisper.cpp/build-apple
    artifacts:
      - build/OnDeviceLAS-unsigned.ipa
