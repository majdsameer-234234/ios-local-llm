name: Build unsigned IPA

# Codemagic started rejecting builds on this account (free minutes), so the same
# script runs here instead. GitHub-hosted macOS is free on public repositories,
# which this one is.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | tail -5
          pod --version || true
          sw_vers

      - name: Cache native frameworks
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/llama.cpp/build-apple
            ThirdParty/whisper.cpp/build-apple
          key: native-${{ runner.os }}-llama-b10830-${{ hashFiles('scripts/build_native_frameworks.sh', 'Patches/*') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}

      - name: Cache Xcode build products
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('project.yml', 'Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('project.yml', 'Podfile.lock') }}-

      - name: Build IPA
        run: |
          chmod +x CODEMAGIC_BUILD_SCRIPT.sh
          ./CODEMAGIC_BUILD_SCRIPT.sh

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnDeviceLAS-unsigned
          path: build/OnDeviceLAS-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14
